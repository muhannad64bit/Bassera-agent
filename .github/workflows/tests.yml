name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: full suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          VIRTUAL_ENV="$(pwd)/.venv" uv pip install -e ".[all,dev]" "pytest-split>=0.9,<1"

      # The canonical runner: 4 xdist workers, deterministic env
      # (TZ/LANG/PYTHONHASHSEED), credential env vars blanked,
      # tests/integration excluded, tests/e2e INCLUDED (hermetic).
      # CI must run exactly what developers run — no divergence.
      - name: Run tests
        run: scripts/run_tests.sh
        env:
          # Belt-and-suspenders: the runner blanks these too, but a
          # secret-shaped var leaked into the runner's environment
          # must never reach a test.
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
